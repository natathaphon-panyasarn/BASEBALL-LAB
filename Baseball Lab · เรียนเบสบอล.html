<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Noto Sans Thai",system-ui,sans-serif}
h1,h2,h3,.sb b,.nav button{font-family:Kanit,"Noto Sans Thai",system-ui,sans-serif}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:8px 14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;white-space:nowrap}.logo svg{height:34px;width:auto}.wm{font:700 22px/1 Kanit,sans-serif;font-style:italic;letter-spacing:.05em;display:flex;align-items:center;gap:6px}.wm i{background:var(--acc);padding:3px 8px;border-radius:5px;font-size:17px;letter-spacing:.1em;font-style:normal;transform:skewX(-8deg)}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.nav button{background:none;border:0;color:#cfe0f5;padding:8px 12px;border-radius:8px;font-size:15px;cursor:pointer;white-space:nowrap;min-height:40px}
.nav button[aria-current=true]{background:#fff;color:var(--navy)}
.lang{display:flex;border:2px solid #fff;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:6px 12px;font-weight:600;cursor:pointer;min-height:36px}
.lang button[aria-pressed=true]{background:#fff;color:var(--navy)}
main{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
section[hidden]{display:none}
h1{font-size:clamp(30px,6vw,52px);line-height:1.15;margin:.2em 0}h2{font-size:26px;margin:.2em 0 .5em}h3{margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 16px "Noto Sans Thai",sans-serif;cursor:pointer;min-height:44px}
.btn.alt{background:var(--card);color:var(--fg);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,.pl:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.mut{color:var(--mut)}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:13px}
.stage{cursor:pointer;text-align:left;font:inherit;color:inherit}.stage b{color:var(--acc);font-family:Kanit}
svg.field{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line)}
.mv{transition:transform var(--d,.6s) ease-in-out,opacity .4s}.hid{opacity:0;pointer-events:none}
.pl{cursor:pointer}.pl circle{fill:var(--blue);stroke:#fff;stroke-width:2}.pl text,.of text{fill:#fff;font:700 11px Kanit,sans-serif;text-anchor:middle;pointer-events:none}
.pl:hover circle{stroke:var(--gold)}
.pl.sel circle{stroke:var(--gold);stroke-width:5;stroke-dasharray:5 3}.pl.good circle{stroke:#28d17c;stroke-width:5}.pl.bad circle{stroke:#ff4d4d;stroke-width:5;stroke-dasharray:3 3}
.pl.hint circle{stroke:var(--gold);stroke-width:5}
.of rect{fill:var(--org);stroke:#fff;stroke-width:2}
.lb{font:600 12px "Noto Sans Thai",sans-serif;fill:#fff;opacity:.85;text-anchor:middle;pointer-events:none}
.sb{display:flex;gap:8px;flex-wrap:wrap}.sb>div{background:var(--navy);color:#fff;border-radius:10px;padding:4px 14px;text-align:center;min-width:64px}
.sb b{font-size:26px;display:block;line-height:1.2}.sb span{font-size:12px;opacity:.85}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ctl select{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg);padding:0 8px;font:inherit}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button,.dot{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;min-height:42px}
.tabs button[aria-pressed=true],.dot.cur{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.dot.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.fb{border-left:6px solid var(--mut);padding:10px 14px;margin-top:10px;background:var(--card);border-radius:8px}.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;color:inherit;cursor:pointer;min-height:46px}
.opt:hover{border-color:var(--blue)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:8px 0}
@media(prefers-reduced-motion:reduce){.mv{transition:none}}
</style></head><body>

<main>

<section id="s-sim" hidden><h2 data-i="sim"></h2><div class="tabs" id="scn"></div><div class="two"><div><div id="sf"></div><div class="card" id="teams" style="margin-top:8px" aria-live="polite"></div>

<section id="s-rules" hidden><h2 data-i="rules"></h2><div class="grid" id="rulec"></div>
<h2 style="margin-top:24px" data-i="try"></h2><div class="card"><div id="rsb" class="sb"></div><p id="rscore" class="mut"></p>
<div class="ctl" id="rbtn"></div><div class="fb" id="rmsg" aria-live="polite"></div></div></section>

<section id="s-chal" hidden><h2 data-i="chal"></h2><div class="tabs" id="cnav"></div><div class="two"><div id="cfield"></div><div><div class="card"><span class="pill" id="ccat"></span><h3 id="cq"></h3><div id="copts"></div><div class="ctl"><button class="btn alt" id="chint"></button><button class="btn" id="cnext"></button></div></div><div id="cfb" aria-live="polite"></div></div></div></section>

<section id="s-prog" hidden><h2 data-i="prog"></h2><div class="grid" id="pg"></div><p><button class="btn alt" id="reset" data-i="reset"></button></p></section>
</main>

 if(k=='str'){m.s++;m.m='mStr';if(m.s==3){m.m='mK';m.o++;m.b=m.s=0}}
 if(k=='foul'){if(m.s<2){m.s++;m.m='mFoul'}else m.m='mFoul2'}
 if(k=='out'){m.o++;m.b=m.s=0;m.m='mOut'}
 if(k=='run'){m[m.top?'a':'h']++;m.m='mRun'}
 if(m.o>=3){m.o=0;m.b=m.s=0;m.m='mHalf';if(m.top)m.top=false;else{m.top=true;m.inn++}}render()}
// challenges
const QS=[
{id:'c1',tp:'pos',k:'c',a:['P'],q:['ใครเป็นผู้ขว้างลูกให้ผู้ตี?','Which player throws the ball to the batter?']},
{id:'c2',tp:'pos',k:'c',a:['C'],q:['ใครนั่งหลังโฮมเพลตเพื่อรับลูกที่ขว้างมา?','Who crouches behind home plate to catch the pitches?']},
{id:'c3',tp:'pos',k:'c',a:['1B'],q:['ผู้ตีวิ่งไปเบสหนึ่ง ใครเฝ้าเบสนั้น?','The batter runs to first base. Who guards that base?']},
{id:'f1',tp:'follow',k:'c',ball:[150,300],a:['3B','SS'],q:['ลูกกลิ้งไปทางเบสสาม ใครควรขยับไปเก็บลูก?','A ground ball rolls toward third base. Who should move to field it?'],why:['ลูกไปทางเบสสาม คนที่ใกล้ที่สุดคือผู้รักษาเบสสาม (หรือชอร์ตสต็อป)','The ball heads to third, so the third baseman (or shortstop) is closest.']},
{id:'f2',tp:'follow',k:'c',ball:[100,130],a:['LF','CF'],q:['ลูกลอยสูงไปทางสนามซ้าย ใครควรวิ่งไปจับ?','A high fly ball heads to left field. Who should go catch it?'],why:['ลูกลอยไปสนามนอกซ้าย ผู้เล่นสนามซ้ายคือคนรับผิดชอบ (สนามกลางช่วยได้)','Left field is the left fielder’s zone (the center fielder can help).']},
{id:'w1',tp:'rule',k:'m',q:['ลูกกลิ้ง ไม่มีผู้วิ่งบนเบส ผู้เล่นรับลูกได้แล้ว ควรทำอะไร?','A ground ball, no runners on base, and a fielder has the ball. Best play?'],
 o:[['โยนไปเบสหนึ่งก่อนผู้ตีถึง','Throw to first before the batter arrives',1],['โยนไปโฮมเพลต','Throw to home plate',0,'ไม่มีผู้วิ่งที่จะเข้าโฮม จึงไม่ได้เอาต์ใคร','No one is trying to score, so no out is made there.'],['ถือลูกไว้เฉยๆ','Just hold the ball',0,'ผู้ตีจะถึงเบสหนึ่งโดยปลอดภัย เสียโอกาสทำเอาต์','The batter would reach first safely: a wasted out.']],ex:['โยนไปเบสหนึ่ง เป็นฟอร์ซเอาต์','Throw to first: a force out.']},
{id:'w2',tp:'rule',k:'m',q:['ผู้ตีตีลูกลอย ผู้เล่นสนามนอกจับได้ก่อนลูกตกพื้น เกิดอะไรขึ้น?','A fly ball is caught before it hits the ground. What happens?'],
 o:[['ผู้ตีเอาต์','The batter is out',1],['ผู้ตีได้เดินไปเบสหนึ่ง','The batter walks to first',0,'การเดินเกิดจาก 4 บอลเท่านั้น','A walk only comes from four balls.'],['นับเป็นสไตรก์','It counts as a strike',0,'ลูกที่ตีแล้วถูกจับ ไม่ใช่สไตรก์ แต่เป็นเอาต์ทันที','A caught batted ball is an out, not a strike.']],ex:['ลูกที่ตีแล้วถูกจับก่อนตกพื้นคือเอาต์','A batted ball caught in the air is an out.']},
{id:'s1',tp:'score',k:'m',q:['มีผู้วิ่งอยู่เบสสาม 1 คน ผู้ตีตีโฮมรัน ได้กี่คะแนน?','A runner is on third and the batter hits a home run. How many runs score?'],
 o:[['2 คะแนน','2 runs',1],['1 คะแนน','1 run',0,'ผู้ตีเองก็ทำคะแนนจากโฮมรันด้วย','The batter scores on a home run too.'],['0 คะแนน','0 runs',0,'โฮมรันทำให้ทุกคนวิ่งเข้าโฮมได้','A home run lets everyone score.']],ex:['ผู้วิ่ง 1 คน + ผู้ตี 1 คน = 2 คะแนน','1 runner + 1 batter = 2 runs.']},
{id:'s2',tp:'score',k:'m',q:['นับได้ 3 บอล 2 สไตรก์ ผู้ขว้างโยนนอกเขต ผู้ตีไม่ตี เกิดอะไรขึ้น?','Count is 3 balls, 2 strikes. The pitch is outside the zone and not swung at. What happens?'],
 o:[['ผู้ตีเดินไปเบสหนึ่ง (Walk)','The batter walks to first (Walk)',1],['ผู้ตีเอาต์','The batter is out',0,'ผู้ตีเอาต์เมื่อครบ 3 สไตรก์ แต่นี่คือบอลที่ 4','Out needs three strikes; this is ball four.'],['นับใหม่โดยไม่มีอะไรเกิด','Nothing happens',0,'ครบ 4 บอลแล้ว ผู้ตีได้ไปเบสหนึ่ง','Four balls sends the batter to first.']],ex:['บอลที่ 4 = Walk','Ball four = Walk.']},
{id:'s3',tp:'score',k:'m',q:['มี 2 สไตรก์ ผู้ตีตีลูกฟาวล์ ผลเป็นอย่างไร?','Two strikes and the batter hits a foul ball. What is the count?'],
 o:[['ยังเป็น 2 สไตรก์','Still 2 strikes',1],['3 สไตรก์ เอาต์','Strike three, out',0,'ฟาวล์ไม่ทำให้เป็นสไตรก์ที่ 3','A foul can’t be strike three.'],['นับเป็นบอล','It counts as a ball',0,'ฟาวล์ไม่ใช่บอล','A foul is not a ball.']],ex:['ฟาวล์เมื่อมี 2 สไตรก์ ผู้ตียังอยู่ต่อ','A foul with two strikes keeps the batter alive.']}];
let ch={i:0,tries:0,hint:false,fb:null},cf;
const rec=(q,ok)=>{if(ok){if(!P.done[q.id]){P.done[q.id]=1;P.xp+=ch.tries?5:10}P.ok[q.tp]=(P.ok[q.tp]||0)+1}else P.bad[q.tp]=(P.bad[q.tp]||0)+1;ch.tries++;save()};
function pickC(k){const q=QS[ch.i];if(q.k!='c')return;cf.clear();const ok=q.a.includes(k),p=POS.find(x=>x.id==k);rec(q,ok);cf.mark(k,ok?'good':'bad');
 if(ok)ch.fb={ok:1,fn:()=>`✅ ${u('done')} ${T(p.n)} (${p.a}): ${T(p.r)}`};
 else{const c=POS.find(x=>x.id==q.a[0]);cf.mark(c.id,'hint');ch.fb={ok:0,fn:()=>`❌ ${u('notq')} ${u('isa')} ${T(p.n)} (${p.a}): ${T(p.r)}\n${q.why?T(q.why)+'\n':''}${u('right')} ${T(c.n)} (${c.a}): ${T(c.w)}.`}}render()}
function pickM(j){const q=QS[ch.i],o=q.o[j];rec(q,o[2]);ch.fb=o[2]?{ok:1,fn:()=>`✅ ${u('done')} ${T(q.ex)}`}:{ok:0,fn:()=>`❌ ${u('notq')} ${lang=='th'?o[3]:o[4]}`};render()}
const TOP=['pos','follow','rule','score'];
function render(){
 document.documentElement.lang=lang;
 $$('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l==lang));
 $$('[data-i]').forEach(n=>n.textContent=u(n.dataset.i));
 $$('#nav button').forEach(b=>b.textContent=u(b.dataset.go));
 $('#stages').innerHTML=[['field','เข้าใจสนาม','Know the field'],['field','เรียนรู้ 9 ตำแหน่ง','Meet the 9 positions'],['learn','รุกและรับ','Offense & defense'],['rules','กติกาพื้นฐาน','Basic rules'],['sim','ดูสถานการณ์จริง','Watch real plays'],['chal','ฝึกด้วยภารกิจ','Practice with challenges']].map((s,i)=>`<button class="card stage" data-go="${s[0]}"><b>${i+1}</b> ${T([s[1],s[2]])}</button>`).join('');
 $('#learnc').innerHTML=LEARN.map(c=>`<div class="card"><h3>${c[0]} ${T([c[1],c[2]])}</h3><p>${T([c[3],c[4]])}</p></div>`).join('');
 $('#rulec').innerHTML=RULES.map(c=>`<div class="card"><h3>${c[0]} ${T([c[1],c[2]])}</h3><p>${T([c[3],c[4]])}</p></div>`).join('');
 const p=POS.find(x=>x.id==sel);
 $('#info').innerHTML=p?`<h3>${T(p.n)} <span class="pill">${p.a}</span></h3><p><b>${u('wh')}:</b> ${T(p.w)}</p><p><b>${u('ro')}:</b> ${T(p.r)}</p><p><b>${u('te')}:</b> ${T(p.t)}</p><p><b>${u('ex')}:</b> ${T(p.e)}</p>`:`<p class="mut">${u('tap')}</p>`;
 simShow();
 $('#rsb').innerHTML=sbHTML(R,R.inn,R.top);$('#rscore').textContent=`${u('away')} ${R.a} – ${R.h} ${u('home')} · ${u(R.top?'top':'bot')}`;$('#rmsg').textContent=u(R.m);
 $('#rbtn').innerHTML=[['ball','bBall'],['str','bStr'],['foul','bFoul'],['out','bOut'],['run','bRun']].map(x=>`<button class="btn alt" data-r="${x[0]}">${u(x[1])}</button>`).join('');
 // challenge
 const q=QS[ch.i];$('#cnav').innerHTML=QS.map((x,j)=>`<button class="dot ${j==ch.i?'cur':''} ${P.done[x.id]?'ok':''}" data-j="${j}" aria-label="${j+1}">${P.done[x.id]?'✓':j+1}</button>`).join('');
 $('#ccat').textContent=u(q.tp);$('#cq').textContent=T(q.q);$('#cfield').style.display=q.k=='c'?'':'none';
 $('#copts').innerHTML=q.k=='m'?q.o.map((o,j)=>`<button class="opt" data-m="${j}">${T([o[0],o[1]])}</button>`).join(''):'';
 $('#chint').textContent=u('hint');$('#cnext').textContent=u('nextq');$('#cnext').disabled=!P.done[q.id];
 const hintT=q.k=='c'?(q.why?T(q.why):T(POS.find(x=>x.id==q.a[0]).w)):T(q.q);
 $('#cfb').innerHTML=(ch.hint&&q.k=='c'?`<div class="fb">💡 ${hintT}</div>`:'')+(ch.fb?`<div class="fb ${ch.fb.ok?'ok':'no'}" style="white-space:pre-line">${ch.fb.fn()}</div>`:'');
 // progress
 const nd=Object.keys(P.done).length,okN=Object.values(P.ok).reduce((a,b)=>a+b,0),bdN=Object.values(P.bad).reduce((a,b)=>a+b,0);
 const per=t=>{const a=P.ok[t]||0,b=P.bad[t]||0;return a+b?Math.round(100*a/(a+b)):0};
 const bad=TOP.filter(t=>(P.bad[t]||0)>(P.ok[t]||0));
 $('#pg').innerHTML=`<div class="card"><h3>${u('xp')}</h3><p style="font-size:34px;margin:0">⭐ ${P.xp}</p><p>${u('cd')}: ${nd}/${QS.length}</p><div class="bar"><i style="width:${100*nd/QS.length}%"></i></div><p>${u('ca')}: ${okN} / ${bdN}</p></div>
 <div class="card"><h3>${u('tp')}</h3>${TOP.map(t=>`<p style="margin:.4em 0">${u(t)}: ${per(t)}%</p><div class="bar"><i style="width:${per(t)}%"></i></div>`).join('')}<p><b>${u('pr')}:</b> ${bad.length?bad.map(u).join(', '):'—'}</p></div>
 <div class="card"><h3>${u('bd')}</h3><p>${okN?'🥇':'▫️'} ${u('b1')}</p><p>${SEC.every(s=>P.vis[s])?'🧭':'▫️'} ${u('b2')}</p><p>${nd==QS.length?'🏆':'▫️'} ${u('b3')}</p></div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b)rAct(b.dataset.r);
 const m=e.target.closest('[data-m]');if(m)pickM(+m.dataset.m);
 const j=e.target.closest('#cnav [data-j]');if(j)gotoQ(+j.dataset.j);
 const s=e.target.closest('#scn [data-j]');if(s){simStop();sim.sid=+s.dataset.j;sim.i=0;simShow()}});
function gotoQ(i){ch={i,tries:0,hint:false,fb:null};const q=QS[i];cf.clear();if(q.k=='c'){cf.el.bat.classList.add('hid');cf.el.run.classList.add('hid');cf.place('ball',q.ball||[220,290]);cf.el.ball.classList.toggle('hid',!q.ball)}render()}
ef=mount($('#ef'),pickE);ef.el.run.classList.add('hid');ef.el.ball.classList.add('hid');
mount($('#hf'));sf=mount($('#sf'));cf=mount($('#cfield'),pickC);
$('#bPlay').onclick=simPlay;$('#bNext').onclick=()=>{simStop();sim.i++;simShow()};$('#bBack').onclick=()=>{simStop();sim.i--;simShow()};$('#bRe').onclick=()=>{simStop();sim.i=0;simShow()};
$('#spd').onchange=e=>{sim.spd=+e.target.value;if(sim.play){clearInterval(sim.tm);sim.tm=setInterval(simTick,2300/sim.spd)}simShow()};
$('#chint').onclick=()=>{ch.hint=true;render()};$('#cnext').onclick=()=>gotoQ((ch.i+1)%QS.length);
$('#reset').onclick=()=>{P={xp:0,done:{},ok:{},bad:{},vis:{}};save();gotoQ(0)};
gotoQ(0);$go('home');
</script></body></html>
